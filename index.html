<style>
:root{--bg:#08080a;--card:#131316;--line:#2e1316;--tx:#f2f2f2;--mu:#948a8c;--ac:#e11d2e;--ok:#2ecc71;--bad:#e74c3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#4a0a10 0,transparent 60%),radial-gradient(900px 500px at 100% 100%,#2c0509 0,transparent 55%),var(--bg);background-attachment:fixed;color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:12px}
h1,h2,h3{margin:0}.logo{font-weight:900;letter-spacing:1px}.logo b{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
input,select{width:100%;padding:11px;margin:5px 0 10px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;font-size:15px}
button{background:linear-gradient(135deg,#e11d2e,#ff4d5a);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:700;font-size:15px;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--line)}button.big{width:100%;padding:15px;font-size:17px}
button:disabled{opacity:.5}
nav{display:flex;gap:6px;overflow-x:auto;margin:10px 0}nav button{background:var(--card);color:var(--mu);border:1px solid var(--line);white-space:nowrap}nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.lvl{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:3px solid var(--c);font-weight:800;font-size:14px;flex:none}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.mu{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.st{background:var(--bg);border-radius:8px;padding:10px;text-align:center}.st b{display:block;font-size:20px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}.p{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);min-width:0}.p span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mu);font-size:12px}
.w{color:var(--ok)}.l{color:var(--bad)}.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.err{color:var(--bad);font-size:13px;min-height:18px}.ov{overflow-x:auto}

#sk{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1}
.card{background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(8px);transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{border-color:var(--ac);box-shadow:0 6px 30px -10px var(--ac)}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{text-shadow:0 0 6px #e11d2e66}50%{text-shadow:0 0 22px #e11d2e,0 0 40px #ff4d5a55}}
@keyframes ring{0%{box-shadow:0 0 0 0 #e11d2e88}100%{box-shadow:0 0 0 28px #e11d2e00}}
@keyframes sh{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}

#v>*:nth-child(2){animation-delay:.08s}#v>*:nth-child(3){animation-delay:.16s}
.logo{animation:glow 3.5s ease-in-out infinite}
button{position:relative;overflow:hidden;transition:transform .15s,filter .2s}
button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.1)}button:active{transform:scale(.97)}
button.big::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#fff5 50%,transparent 70%);animation:sh 2.6s infinite}
button.g::after{display:none}
.lvl{box-shadow:0 0 10px var(--c);transition:transform .3s}.lvl:hover{transform:rotate(360deg) scale(1.15)}
.bar i{transition:width .8s cubic-bezier(.2,.7,.2,1);background:linear-gradient(90deg,#e11d2e,#ff6b6b)}
.st{transition:transform .2s}.st:hover{transform:translateY(-4px)}

html.ui-max .promo,html.ui-max.ui-light .promo{background:linear-gradient(100deg,color-mix(in srgb,var(--ac) 30%,rgba(8,8,12,.6)),rgba(8,8,12,.5));backdrop-filter:blur(24px) saturate(130%);-webkit-backdrop-filter:blur(24px) saturate(130%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
html.ui-max .bar{background:rgba(0,0,0,.45);box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
html.ui-max .toast{background:rgba(10,10,14,.7);backdrop-filter:blur(26px) saturate(130%);-webkit-backdrop-filter:blur(26px) saturate(130%);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 12px 36px rgba(0,0,0,.5)}
html.ui-max .md{background:rgba(0,0,0,.5);backdrop-filter:blur(20px) saturate(120%);-webkit-backdrop-filter:blur(20px) saturate(120%)}
html.ui-max table td,html.ui-max table th,html.ui-max .p{border-bottom-color:rgba(255,255,255,.1)}
html.ui-max.ui-lite .card{backdrop-filter:blur(8px)}

.maxsec{padding:14px;margin:4px 0 6px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 22%,transparent),rgba(255,255,255,.04))}
button.sw2,html.ui-max button.sw2{flex:none;width:56px;height:34px;padding:0;position:relative;border:0;border-radius:20px;background:rgba(120,120,128,.45);box-shadow:inset 0 1px 3px rgba(0,0,0,.35);backdrop-filter:none;transition:background .3s}
button.sw2 i{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
button.sw2.on,html.ui-max button.sw2.on{background:#34c759}
button.sw2.on i{transform:translateX(22px)}

/* ===== красивый поиск матча ===== */
.pl-hero{text-align:center}.pl-ic{width:84px;height:84px;margin:0 auto 6px;display:grid;place-items:center;border-radius:50%;color:var(--ac);background:radial-gradient(circle,color-mix(in srgb,var(--ac) 22%,transparent),transparent 70%);animation:plIc 3s ease-in-out infinite}
@keyframes plIc{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.06) rotate(8deg)}}
.pl-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.pl-stats div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 4px}
.pl-stats b{display:block;font:800 20px 'Unbounded',system-ui,sans-serif}.pl-stats span{font-size:12px;color:var(--mu)}
.cta{position:relative;font-size:18px;letter-spacing:.5px}
.cta::before{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid var(--ac);animation:ctaR 2s ease-out infinite;pointer-events:none}
@keyframes ctaR{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.12,1.5);opacity:0}}
.radar{position:relative;width:210px;height:210px;margin:10px auto 16px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 14%,transparent),transparent 70%);border:1px solid rgba(255,255,255,.12)}
.radar::before,.radar::after{content:"";position:absolute;border-radius:50%;border:1px dashed rgba(255,255,255,.14)}.radar::before{inset:28px}.radar::after{inset:58px}
.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--ac);opacity:0;animation:rad 3s ease-out infinite}
.radar i:nth-child(2){animation-delay:1s}.radar i:nth-child(3){animation-delay:2s}
@keyframes rad{0%{transform:scale(.25);opacity:.8}100%{transform:scale(1);opacity:0}}
.radar .rsw{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 290deg,color-mix(in srgb,var(--ac) 55%,transparent) 360deg);animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rc{position:relative;z-index:2;text-align:center;background:rgba(0,0,0,.55);border-radius:50%;width:104px;height:104px;display:grid;place-content:center;border:1px solid rgba(255,255,255,.2)}
.rc b{font:800 30px 'Unbounded',system-ui,sans-serif}.rc span{font-size:10px;color:var(--mu);max-width:84px}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 8px;margin:4px 0}
.slot{position:relative;display:grid;place-items:center;transition:opacity .4s,filter .4s,transform .4s}
.slot:not(.on){opacity:.22;filter:grayscale(1);transform:scale(.86)}
.slot.on{animation:popin .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes popin{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.lvbadge{position:absolute;right:6px;bottom:-4px;font-size:10px;font-weight:800;background:#000;border:2px solid var(--ac);border-radius:50%;width:19px;height:19px;display:grid;place-items:center}
.found{text-align:center}.found-t{font:800 24px 'Unbounded',system-ui,sans-serif;background:linear-gradient(90deg,var(--ac),#fff,var(--ac));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.5s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.vsgrid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;text-align:left}
.tcol{border-radius:16px;padding:10px 8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);min-width:0}
.tcol.mine{border-color:color-mix(in srgb,var(--ac) 60%,transparent);box-shadow:0 0 24px -8px var(--ac)}
.thead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:14px}
.pcard{display:flex;align-items:center;gap:6px;padding:6px 4px;border-radius:12px;min-width:0}
.pcard.me{background:color-mix(in srgb,var(--ac) 20%,transparent)}
.pcard .pn{flex:1;min-width:0}.pcard .n{font-size:13px;font-weight:700}.pcard .mu{font-size:11px}
.pcard .lvl{width:26px;height:26px;font-size:11px;border-width:2px}
.vsb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:800 13px 'Unbounded',system-ui,sans-serif;background:#000;color:#fff;border:2px solid var(--ac);box-shadow:0 0 22px var(--ac);z-index:2}
.mt{font:800 26px 'Unbounded',system-ui,sans-serif;color:var(--ac)}
.steps2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.s2{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.05);font-size:13px;opacity:.55}
.s2.on{opacity:1;background:color-mix(in srgb,var(--ac) 20%,transparent)}
.s2 b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:#fff;flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.seg button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--tx);box-shadow:none}
.seg button.on[data-v=w]{background:linear-gradient(135deg,#1e9e55,#2ecc71);color:#fff;border-color:transparent}
.seg button.on[data-v=l]{background:linear-gradient(135deg,#a8221f,#e74c3c);color:#fff;border-color:transparent}
.kda3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.kd{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:8px 6px;text-align:center}
.kd input{text-align:center;font-size:22px;font-weight:800;margin:2px 0}.kd label{font-size:11px;color:var(--mu)}
.upl{display:grid;place-items:center;padding:18px 10px;margin:8px 0;border:2px dashed rgba(255,255,255,.28);border-radius:14px;cursor:pointer;text-align:center;font-size:14px;word-break:break-all}
.upl.ok{border-color:var(--ok);color:var(--ok)}
.tli{display:flex;align-items:center;gap:12px;padding:10px 0}
.tli:last-child{animation:vin .4s both}
.tli .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ac);font-weight:800;flex:none}
.tli.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.tli.cur .dot{animation:pulseDot 1s ease-in-out infinite}
@keyframes pulseDot{50%{transform:scale(1.15)}}
.pcard .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .mu{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .lvl{flex:none}

/* ===== ПРОИЗВОДИТЕЛЬНОСТЬ ===== */
#sk{z-index:5}
/* размытие только у шапки, меню, окон и подсказок — карточки без blur (он почти не виден, но сильно тормозит) */
.st,.chip,.msg,input,select,textarea,button,.promo{backdrop-filter:none;-webkit-backdrop-filter:none}
.card{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 22px rgba(0,0,0,.28)}
html.ui-max .card,html.ui-max.ui-black .card,html.ui-max.ui-light .card{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px rgba(0,0,0,.38)}
html.ui-max .card{background:var(--gl)}
html.ui-max .md .card{background:rgba(12,12,16,.9)}
html.perf-low *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html.perf-low .card,html.perf-low .st,html.perf-low .chip,html.perf-low nav,html.perf-low #hd{box-shadow:none!important}
html.perf-low .promo::after,html.perf-low .poster::after,html.perf-low button.big::after,html.perf-low .cta::before,html.perf-low .radar i,html.perf-low .radar .rsw,html.perf-low .pl-ic,html.perf-low .found-t,html.perf-low .dm,html.perf-low .tw,html.perf-low .bd,html.perf-low .fm-fire,html.perf-low .cf i{animation:none!important}
html.perf-low .enter>*{animation-duration:.2s!important}
html.perf-low nav,html.perf-low #hd{background:rgba(10,10,14,.92)!important}
html.perf-low .md{background:rgba(0,0,0,.72)!important}
html.perf-low.ui-max .card{background:rgba(12,12,16,.82)!important}

.ib{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);width:min(560px,calc(100% - 24px));z-index:60;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:20px;background:rgba(12,12,16,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.18);box-shadow:0 14px 36px rgba(0,0,0,.5);animation:ibin .5s cubic-bezier(.22,.8,.24,1) both}
.ib img{height:30px;flex:none}.ib b{font-size:13.5px}.ib .mu{font-size:11.5px}.ib button{flex:none;padding:9px 14px;font-size:14px}.ib .x{flex:none;padding:6px;color:var(--mu);cursor:pointer}
@keyframes ibin{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.card.row>button,.card .row.sp>button{flex:none;white-space:nowrap}

/* ===== АДАПТИВ: телефоны, планшеты, ПК, альбомная ориентация ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

img,svg,canvas{max-width:100%}
.wrap{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
.card{min-width:0;overflow-wrap:break-word}
.ov{-webkit-overflow-scrolling:touch}
label.mu{display:block;margin-top:2px}
.auth{max-width:460px;margin-left:auto;margin-right:auto}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:10px}.two>div{min-width:0}
button:not(.chip):not(.sw2){min-height:44px}
nav button,.ib .x{min-height:0}
.chip{min-height:36px}
.md{overflow-y:auto;align-items:start;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.md .card{margin:auto;max-height:calc(100dvh - 32px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.md{place-items:center}
.radar{width:min(210px,62vw);height:min(210px,62vw)}

/* маленькие телефоны */
@media (max-width:360px){
 .wrap{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
 .two{grid-template-columns:1fr}
 .card{padding:10px}
 h2{font-size:15px}.hh{font-size:22px}.bn{font-size:14px}
 nav{width:calc(100% - 12px);padding:4px}nav button{font-size:9px}nav button svg{width:20px;height:20px}
 .slots{gap:10px 4px}.lvbadge{right:2px}
 .kda3{gap:5px}.kd input{font-size:18px}
 .steps2{grid-template-columns:1fr}
 .pl-stats b{font-size:16px}.pl-stats span{font-size:11px}
 .vsgrid{gap:6px}.tcol{padding:8px 5px}.pcard .n{font-size:12px}
 .b1{font-size:54px}.sb{font-size:18px}.pt{max-width:74%}
 .found-t{font-size:20px}.mt{font-size:22px}
 .grid{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
 .st b{font-size:17px}
 .toast{max-width:94vw}
}

@media (max-width:600px){
 .poster{padding:22px 16px 20px;min-height:290px}
 .hero{padding:18px}
 .vsb{width:36px;height:36px;font-size:11px}

 table{font-size:13px}
 .teams,.vsgrid{grid-template-columns:1fr 1fr}
}
/* планшеты */
@media (min-width:700px){
 .wrap{max-width:780px;padding-top:18px}
 h2{font-size:20px}
 nav{width:min(620px,calc(100% - 48px))}nav button{font-size:12px;padding:9px 2px}nav button svg{width:26px;height:26px}
 .poster{min-height:340px;padding:34px 30px}.pt{max-width:62%}

 .grid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
}
/* ноутбуки и ПК */
@media (min-width:1024px){
 body{font-size:16px}
 .wrap{max-width:960px;padding-top:24px}
 nav{width:min(680px,calc(100% - 48px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}

}

 nav .ind{top:3px;bottom:3px}
 .poster{min-height:240px}

}

/* курсор мыши: без залипания hover на сенсорных, аккуратные скроллбары на ПК */

html{overflow-x:clip}
#sk{max-width:100vw}
.wrap{overflow-x:clip}

/* ===== значки-картинки ===== */
.bi{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:7px;margin-right:5px;vertical-align:middle;flex:none;background:linear-gradient(160deg,#fff,#d9dce5);box-shadow:0 0 0 1px rgba(255,255,255,.35)}

.bi-edge{background:linear-gradient(160deg,#0b2230,#05121b);box-shadow:0 0 0 1px #00e5ff66,0 0 9px #00e5ff77}

/* ===== PRO LEAGUE ===== */
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 #2ecc7188;animation:pdot 1.6s ease-out infinite;margin-right:8px;flex:none;vertical-align:middle}
@keyframes pdot{0%{box-shadow:0 0 0 0 #2ecc7199}100%{box-shadow:0 0 0 10px #2ecc7100}}
.prq{display:flex;align-items:center;margin-top:6px;font-size:14px}

/* ===== установка, зелёный фон, топ Pro ===== */
.appic{width:46px;height:46px;border-radius:13px;flex:none;background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.appic.big{width:84px;height:84px;border-radius:22px}
.ib img{width:38px;height:38px;border-radius:10px;object-fit:cover}
html.ui-green{--bg:#04100a;--card:#0a1a11;--line:#14402a}
html.ui-green body::before{background:radial-gradient(1200px 600px at 20% -10%,#0f6a37 0,transparent 60%),radial-gradient(900px 500px at 100% 100%,#06451f 0,transparent 55%)}

html.ui-green .st,html.ui-green .msg,html.ui-green .chip{background:rgba(5,22,13,.8)}

.row.sp>b{flex:none}
h2,h3{overflow-wrap:anywhere}
.row .mu{overflow-wrap:anywhere}

.sc-card{padding:16px}
.sc-top{display:flex;align-items:center;gap:14px}
.sc-lv{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font:800 22px system-ui;border:3px solid var(--c);color:var(--c);box-shadow:0 0 20px -5px var(--c);flex:none}
.sc-cap{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.sc-num{font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-.5px}
.sc-rank{margin-left:auto;text-align:right}

.sc-ring .t span{font-size:10px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}

let DB;
function load(){try{DB=JSON.parse(localStorage.getItem('mlbb_db'))}catch(e){}
 if(!DB||!DB.users){DB={users:{},session:null,bots:[]}}DB.bots=[]}

let _sv=0;function save(){clearTimeout(_sv);_sv=setTimeout(saveNow,250)}

function norm(u){u.coins=u.coins||0;u.fr=u.fr||[];u.inv=u.inv||[];const d=new Date().toDateString();if(!u.ms||u.ms.d!=d)u.ms={d,p:{},c:[]}}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
function finish(){const win=$('rs').value=='w',k=Math.max(0,+$('k').value||0),d=Math.max(0,+$('d').value||0),a=Math.max(0,+$('a').value||0);
 if($('mn').value.trim()!=m.no)return $('fe').textContent='Укажите верный № матча: '+m.no;
 if(!$('sf').files.length)return $('fe').textContent='Прикрепите финальный скриншот';
 const st=['Заявка отправлена','Result Pending — в очереди обработки','Платформа сверяет участника матча','Результат подтверждён'];let i=0;
 $('v').innerHTML=`<div class="card"><h2>Матч №${m.no}</h2><div id="pl"></div></div>`;
 const t=setInterval(()=>{$('pl').innerHTML=st.slice(0,i+1).map((x,j)=>{const ok=j<i||i==3;return `<div class="p"><span class="lvl" style="--c:${ok?'#2ecc71':'#e11d2e'}">${ok?'✓':'…'}</span><span>${x}</span></div>`}).join('');if(i++==3){clearInterval(t);setTimeout(()=>commit(win,k,d,a),700)}},900)}
function msV(){const u=me();$('v').innerHTML=`<div class="card row sp"><div><h2>Ежедневные миссии</h2><div class="mu">Обновляются каждый день</div></div><b>🪙 ${u.coins}</b></div>`+MS.map(q=>{const p=Math.min(q.n,u.ms.p[q.id]||0),dn=p>=q.n,cl=u.ms.c.includes(q.id);return `<div class="card"><div class="row sp"><b>${q.t}</b><span class="mu">+${q.r} 🪙</span></div><div class="bar" style="margin:8px 0"><i style="width:${p/q.n*100}%"></i></div><div class="row sp"><span class="mu">${p}/${q.n}</span><button ${dn&&!cl?'':'disabled'} onclick="claim('${q.id}')">${cl?'Получено':'Забрать'}</button></div></div>`}).join('')}
function claim(id){const u=me(),q=MS.find(x=>x.id==id);if((u.ms.p[id]||0)<q.n||u.ms.c.includes(id))return;u.ms.c.push(id);u.coins+=q.r;save();app();toast('+'+q.r+' 🪙')}
function shopV(){const u=me();$('v').innerHTML=`<div class="card row sp"><div><h2>Магазин</h2><div class="mu">Токены за матчи и миссии</div></div><b>🪙 ${u.coins}</b></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">`+SH.map(i=>{const has=u.inv.includes(i.id),on=i.k=='tag'?u.tag:u.eq==i.c;
 const pv=i.k=='tag'?`<img class="tgi" style="height:30px" src="${TAGS}" alt="2UC">`:`<b style="color:${i.c};font-size:18px">${nkc(u)}</b>`;

const wkId=()=>{const d=new Date(),t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+'-W'+Math.ceil(((t-y)/864e5+1)/7)};
const wkStart=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
const WM=[{id:'wp',t:'Сыграть 15 матчей',n:15,r:150,f:h=>1},{id:'ww',t:'Выиграть 8 матчей',n:8,r:250,f:h=>h.win?1:0},{id:'wk',t:'Набрать 60 убийств',n:60,r:200,f:h=>h.k}];
function wkProg(u,q){const st=wkStart();return Math.min(q.n,u.hist.filter(h=>h.ts>=st).reduce((a,h)=>a+q.f(h),0))}
function weeklyHTML(){const u=me();if(!u.wk||u.wk.w!=wkId())u.wk={w:wkId(),c:[]};
 return `<h3 style="margin:18px 2px 4px">Недельные задания</h3><div class="mu" style="margin:0 2px 8px">Обновляются каждую неделю</div>`+WM.map(q=>{const p=wkProg(u,q),dn=p>=q.n,cl=u.wk.c.includes(q.id);return `<div class="card"><div class="row sp"><b>${q.t}</b><span class="mu">+${q.r} 🪙</span></div><div class="bar" style="margin:8px 0"><i style="width:${p/q.n*100}%"></i></div><div class="row sp"><span class="mu">${p}/${q.n}</span><button ${dn&&!cl?'':'disabled'} onclick="claimW('${q.id}')">${cl?'Получено':'Забрать'}</button></div></div>`}).join('')}

const NICK_MAX=30,NICK_BAD=['__proto__','constructor','prototype','hasownproperty','tostring','valueof'];
function cleanNick(s){return String(s||'').replace(/[\u0000-\u001f\u007f\u200b-\u200f\u2028\u2029\u202a-\u202e\u2060-\u206f\ufeff]/g,'').replace(/\s+/g,' ').trim()}
function nickErr(n){if(!n)return 'Введите никнейм';if(n.length>NICK_MAX)return 'Ник: не больше '+NICK_MAX+' символов';if(NICK_BAD.includes(n.toLowerCase()))return 'Этот ник недоступен';return ''}

function nkc(o){if(!o)return '';const q=(o.nick&&DB.users[String(o.nick).toLowerCase()])||o,c=q.eq||o.eq||o.col||'';return c&&/^#[0-9a-fA-F]{3,8}$/.test(c)?`<span style="color:${c}">${esc(o.nick)}</span>`:esc(o.nick)}

/* --- готовность к игре: после «Принять» нужно ещё подтвердить, что готов играть --- */
const allIn=(map,d)=>d.uids.every(u=>(map||{})[u]===true);
function readyOnV(){if(!m||m.stage!='ready'||!m.online||(tab!='play'&&tab!='pro'))return;
 const N=m.n||(m.A.length+m.B.length),nR=Object.keys(m.rdy||{}).length,mine=!!(m.rdy&&m.rdy[AUTH]),left=Math.max(0,Math.ceil((m.deadline-Date.now())/1000)),b=$('rbtn');
 const label=mine?'ЖДЁМ ОСТАЛЬНЫХ '+nR+'/'+N:'Я ГОТОВ ИГРАТЬ ('+left+')';
 if(b&&b.dataset.no==m.no){b.textContent=label;b.disabled=mine;const r=$('rbar');if(r)r.style.width=Math.min(100,left/45*100)+'%';const t=$('rtx');if(t)t.textContent='Готовы: '+nR+' из '+N;return}
 $('v').innerHTML=`<div class="card found"><div class="found-t">Все приняли матч</div><div class="mu" style="text-align:center;margin:4px 0 10px">Подтвердите, что вы готовы и можете играть прямо сейчас</div><div class="row" style="justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px">${m.pro?'<span class="chip on prochip">PRO LEAGUE</span>':''}<span class="chip on">Матч №${m.no}</span><span class="chip">Сервер: ${esc(m.srv)}</span></div><div class="vsgrid">${teamCol(m.A,m.mine=='A','Команда 1')}${teamCol(m.B,m.mine=='B','Команда 2')}<div class="vsb">VS</div></div><p class="mu" id="rtx" style="text-align:center;margin:10px 0 0">Готовы: ${nR} из ${N}</p><button class="big" id="rbtn" data-no="${m.no}" onclick="readyGo()" style="margin-top:12px" ${mine?'disabled':''}>${label}</button><div class="bar" style="margin-top:10px"><i id="rbar" style="width:100%;transition:width 1s linear"></i></div></div>`;enterV();ensureChat()}
function readyGo(){if(!m||!m.online||m.stage!='ready'||(m.rdy&&m.rdy[AUTH]))return;m.rdy=Object.assign({},m.rdy,{[AUTH]:true});readyOnV();FB.matchUpdate(m.id,{['rdy.'+AUTH]:true}).catch(()=>toast('Ошибка сети'))}
function startReadyTimer(){clearInterval(LTM);LTM=setInterval(()=>{if(!m||m.stage!='ready'){clearInterval(LTM);return}readyOnV();if(m.deadline-Date.now()<=0&&m.docStatus=='ready'){clearInterval(LTM);FB.matchUpdate(m.id,{status:'cancelled',cancelReason:'notready',settledAt:Date.now()}).catch(()=>{})}},1000)}
function onMatchSnap(docs){
 docs.filter(x=>FIN[x.id]&&(x.act||[]).includes(AUTH)).forEach(x=>FB.leaveMatch(x.id,AUTH).catch(()=>{}));docs=docs.filter(x=>!FIN[x.id]);
 const cur=m&&m.online&&m.id?docs.find(x=>x.id==m.id):null;
 docs.filter(x=>['cancelled','done','void'].includes(x.status)).forEach(x=>{if(!cur||cur.id!=x.id)FB.leaveMatch(x.id,AUTH).catch(()=>{})});
 if(cur&&['cancelled','done','void'].includes(cur.status)){
  const msg=cur.status=='cancelled'?(cur.cancelReason=='consent'?'Матч отменён: все игроки согласились. ELO не изменено':cur.cancelReason=='notready'?'Матч отменён: не все подтвердили готовность':'Матч отменён: не все игроки приняли'):cur.status=='void'?'Матч аннулирован: результаты не совпали. ELO не изменено':'Матч завершён судьёй. ELO начислено';
  toast(msg);FIN[cur.id]=1;FB.leaveMatch(cur.id,AUTH).catch(()=>{});clearInterval(LTM);chatStop();m=null;if(tab=='pro')proV();else if(tab=='play')playV();return}
 const d=docs.filter(x=>x.status=='lobby'||x.status=='ready'||x.status=='live').sort((a,b)=>b.ts-a.ts)[0];if(!d)return;
 if(!m||(m.online&&m.stage=='queue')){if(!m&&d.status=='lobby'&&Date.now()-CXL<15000)return;if(d.status=='lobby'&&Date.now()-d.ts>90000){FB.leaveMatch(d.id,AUTH).catch(()=>{});return}joinMatch(d);return}
 if(m.online&&m.id==d.id)syncMatch(d)}
const _jm12=joinMatch;joinMatch=function(d){_jm12(d);if(d.status=='ready'){m.stage='ready';m.rdy=d.rdy||{};m.deadline=Date.now()+45000;tab=m.pro?'pro':'play';app();startReadyTimer()}};
function syncMatch(d){m.acc=d.acc||{};m.rdy=d.rdy||{};m.docStatus=d.status;m.cv=d.cv||{};
 if(d.status=='lobby'&&m.stage=='lobby'){if(allIn(m.acc,d))FB.matchUpdate(d.id,{status:'ready',readyAt:Date.now()}).catch(()=>{});lobbyOnV()}
 else if(d.status=='ready'){if(m.stage!='ready'){m.stage='ready';m.deadline=Date.now()+45000;tab=m.pro?'pro':'play';app();startReadyTimer()}else readyOnV();
  if(allIn(m.rdy,d))FB.matchUpdate(d.id,{status:'live',start:Date.now()}).catch(()=>{})}
 else if(d.status=='live'){if(m.stage!='live'){clearInterval(LTM);m.stage='live';m.start=d.start||Date.now();tab=m.pro?'pro':'play';app()}else cvUpd();
  if(d.uids.every(u=>(d.cv||{})[u]===true))FB.matchUpdate(d.id,{status:'cancelled',cancelReason:'consent',settledAt:Date.now()}).catch(()=>{})}}
const _pv12=playV;playV=function(){if(m&&m.online&&m.stage=='ready')return readyOnV();_pv12()};
const _pr12=proV;proV=function(){if(m&&m.online&&m.stage=='ready')return readyOnV();_pr12()};

/* --- чат матча (лобби, готовность, игра) --- */
let CHAT=[],CHATW=null,CHATID=null,_cmT=0;
const cleanMsg=s=>String(s||'').replace(/[\u0000-\u001f\u007f\u200b-\u200f\u2028\u2029\u202a-\u202e\u2060-\u206f\ufeff]/g,'').replace(/\s+/g,' ').trim().slice(0,200);
function chatStop(){try{CHATW&&CHATW()}catch(e){}CHATW=null;CHATID=null;CHAT=[]}
function chatCard(){return `<div class="card" id="chatc"><h3>Чат матча</h3><div class="chatl" id="chatl"></div><div class="row" style="gap:8px;margin-top:8px"><input id="chati" maxlength="200" placeholder="Сообщение" autocomplete="off" style="margin:0;min-width:0;flex:1" onkeydown="if(event.key=='Enter')chatSend()"><button onclick="chatSend()" style="white-space:nowrap">Отправить</button></div></div>`}
function chatRender(){const el=$('chatl');if(!el)return;const near=el.scrollTop+el.clientHeight>=el.scrollHeight-40;
 el.innerHTML=CHAT.length?CHAT.map(x=>`<div class="cm${x.uid==AUTH?' me':''}"><b>${nkc({nick:String(x.nick||'?')})}</b> ${esc(String(x.text||'').slice(0,200))}</div>`).join(''):'<div class="mu">Сообщений пока нет. Поздоровайтесь с командой.</div>';
 if(near||!el.dataset.init){el.scrollTop=el.scrollHeight;el.dataset.init=1}}
function ensureChat(){if(!ONLINE||!m||!m.online||!['lobby','ready','live'].includes(m.stage)||!$('v'))return;if(!$('chatc'))$('v').insertAdjacentHTML('beforeend',chatCard());
 if(CHATID!==m.id){chatStop();CHATID=m.id;CHATW=FB.watchChat(m.id,l=>{CHAT=l;chatRender()})}chatRender()}
function chatSend(){const i=$('chati');if(!i||!m||!m.online)return;const t=cleanMsg(i.value);if(!t)return;if(Date.now()-_cmT<700)return toast('Не так быстро');_cmT=Date.now();i.value='';
 FB.chatSend(m.id,{uid:AUTH,nick:me().nick,text:t,ts:Date.now()}).catch(()=>toast('Не удалось отправить'))}
const _lo12=lobbyOnV;lobbyOnV=function(){_lo12();ensureChat()};
const _lv12=liveV;liveV=function(){_lv12();ensureChat()};
const _cm12=commit;commit=function(...a){const live=ONLINE&&m&&m.online;_cm12(...a);if(live)chatStop()};

/* --- установка приложения: что мешает --- */
if(!document.querySelector('link[rel=manifest]')&&/^https?:/.test(location.protocol)){const l=document.createElement('link');l.rel='manifest';l.href='manifest.json';document.head.appendChild(l)}
async function instDiag(e){const box=e.querySelector('#idg');if(!box)return;const L=[],ok=(c,t,fix)=>L.push(`<div style="margin:5px 0">${c?'✅':'❌'} ${t}${!c&&fix?`<div style="margin-left:22px;font-size:13px">${fix}</div>`:''}</div>`);
 try{ok(location.protocol=='https:'||location.hostname=='localhost','Защищённое соединение (https)','Сайт должен открываться по адресу https://');
  const lk=document.querySelector('link[rel=manifest]');let man=null;if(lk){try{const r=await fetch(lk.href,{cache:'no-store'});if(r.ok)man=await r.json()}catch(x){}}
  ok(!!man,'Файл manifest.json найден','Загрузите manifest.json в корень сайта рядом с index.html');
  if(man){const ic=man.icons||[],chk=async s=>{const x=ic.find(i=>String(i.sizes||'').indexOf(s)>-1&&i.purpose!='maskable');if(!x)return false;try{return(await fetch(new URL(x.src,lk.href),{cache:'no-store'})).ok}catch(z){return false}};
   ok(await chk('192'),'Иконка 192×192 загружается','Загрузите папку icons');ok(await chk('512'),'Иконка 512×512 загружается','Загрузите папку icons')}
  const reg='serviceWorker' in navigator?await navigator.serviceWorker.getRegistration():null;ok(!!reg,'Сервис-воркер sw.js работает','Загрузите sw.js в корень сайта и обновите страницу')}catch(x){}
 box.innerHTML=L.join('')+(L.length&&!L.join('').includes('❌')?'<div class="mu" style="margin-top:6px">Всё на месте. Откройте меню браузера ⋮ и выберите «Установить приложение». Если пункта нет, закройте сайт и откройте снова.</div>':'')}
function inst(){if(dp){dp.prompt();return}let emb=false;try{emb=window.top!==window}catch(x){emb=true}const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),e=document.createElement('div');e.className='md';e.onclick=ev=>{if(ev.target==e)e.remove()};
 e.innerHTML=`<div class="card"><div style="text-align:center"><img class="appic big" src="${APPICON}" alt=""><h2 style="margin-top:8px">Установить приложение</h2></div>${emb?'<p class="mu">Сейчас сайт открыт во встроенном окне, поэтому установить отсюда нельзя. Откройте сайт по прямой ссылке в браузере и нажмите «Установить» снова.</p>':''}<div id="idg" class="mu" style="margin:10px 0">Проверяем, что нужно для установки…</div><p class="mu">${ios?'1. Откройте сайт в Safari.<br>2. Нажмите «Поделиться».<br>3. Выберите «На экран Домой».':'Если Chrome предлагает только «Добавить на главный экран», это ярлык, а не приложение: исправьте пункты ❌ выше.'}</p><button class="big" onclick="this.closest('.md').remove()">Понятно</button></div>`;document.body.appendChild(e);instDiag(e)}

function uiPrev(){return `<div class="card uiprev"><div class="mu" style="font-size:12px;letter-spacing:.08em;text-transform:uppercase">Предпросмотр</div><div class="row sp" style="margin-top:6px;gap:8px"><b>Пример карточки</b><span class="mu">Пример текста</span></div><div class="bar" style="margin-top:8px"><i class="prevbar"></i></div></div>`}

const bannerHtml=()=>CFG&&CFG.demo?`<div class="card" style="border-color:#ff8a00"><b>ДЕМО-РЕЖИМ ПРЕДПРОСМОТРА</b><div class="mu">Чтобы можно было увидеть лобби, готовность, чат и судью без сервера, соперники здесь демо-игроки («Демо …»). На вашем сайте матчи собираются только из реальных людей.</div></div>`:(CFG&&!ONLINE?`<div class="card" style="border-color:#ff8a00"><b>Нет связи с сервером</b><div class="mu">Лобби, друзья и чат работают только онлайн. Сейчас сайт в офлайн-режиме: проверьте интернет, правила Firestore (Rules) и что адрес сайта добавлен в Authorized domains.</div></div>`:'');
const _hv14=homeV;homeV=function(){_hv14();const b=bannerHtml(),v=$('v');if(b&&v)v.insertAdjacentHTML('afterbegin',b)};
const _pv14=playV;playV=function(){_pv14();const b=bannerHtml(),v=$('v');if(b&&v&&(!m)&&tab=='play')v.insertAdjacentHTML('afterbegin',b)};

function openPlayer(nick){if(!nick)return;if(pinfo(nick))return showP(nick);if(!ONLINE)return;FB.byNick(nick).then(p=>{if(p){cacheUser(p);showP(p.nick)}else toast('Профиль не найден')}).catch(()=>toast('Ошибка сети'))}
function rerenderMatch(){if(!m||!m.online)return;if(m.stage=='lobby'){const b=$('lbtn');if(b)b.remove();lobbyOnV()}else if(m.stage=='ready'){const b=$('rbtn');if(b)b.remove();readyOnV()}else if(m.stage=='live'&&$('v')&&!document.querySelector('#v input:focus,#v textarea:focus')&&!($('chati')&&$('chati').value))liveV()}
async function loadMatchProfiles(){if(!m||!m.online||!ONLINE||!FB.userByUid)return;const id=m.id,todo=[...m.A,...m.B].filter(p=>p.uid&&p.uid!==AUTH&&!(DB.users[String(p.nick).toLowerCase()]||{}).gid);if(!todo.length)return;
 await Promise.all(todo.map(p=>FB.userByUid(p.uid).then(u=>{if(u)cacheUser(u)}).catch(()=>{})));
 if(!m||m.id!==id)return;[...m.A,...m.B].forEach(p=>{const q=DB.users[String(p.nick).toLowerCase()];if(q){p.gid=q.gid;p.w=q.w;p.l=q.l;p.avatar=q.avatar;p.fm=q.fm;p.eq=q.eq;p.bd=q.bd}});rerenderMatch()}
const _jm15=joinMatch;joinMatch=function(d){_jm15(d);setTimeout(loadMatchProfiles,50)};

addEventListener('focusin',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))document.documentElement.classList.add('kb')});addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(!a||!/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))document.documentElement.classList.remove('kb')},50));

load();DB.bots=[];applyUI();if(CFG){bootOnline()}else{DB.session&&me()?app():landing()}

window.__ok=1;

</script>
